name: Build GhostLock APK (EMUI SDK31 patch)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Apply EMUI patch
        run: |
          sed -i 's/minSdk = 34/minSdk = 29/' app/build.gradle.kts
          python3 - <<'EOF'
          p = 'app/src/main/kotlin/com/ghostlock/app/ui/GhostlockUi.kt'
          s = open(p).read()
          old = 'Scaffold(\n            modifier = Modifier.fillMaxSize(),'
          new = 'Scaffold(\n            modifier = Modifier.fillMaxSize(),\n            contentWindowInsets = androidx.compose.foundation.layout.WindowInsets(0, 0, 0, 0),'
          assert old in s, 'Scaffold anchor not found'
          open(p, 'w').write(s.replace(old, new))
          EOF
          grep -n 'minSdk' app/build.gradle.kts

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ghostlock-emui-apk
          path: app/build/outputs/apk/debug/*.apk
